name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/pc-api/web/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: crates/pc-api/web
      - run: npm run build
        working-directory: crates/pc-api/web
      - name: Embedded assets must match the sources
        run: git diff --exit-code -- crates/pc-api/web/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p pc-cli --locked
      - run: npx playwright install --with-deps chromium webkit
        working-directory: crates/pc-api/web
      - run: npm test
        working-directory: crates/pc-api/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: crates/pc-api/web/test-results
