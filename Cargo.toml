[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
pc-core      = { path = "crates/pc-core" }
pc-db        = { path = "crates/pc-db" }
pc-walk      = { path = "crates/pc-walk" }
pc-lightroom = { path = "crates/pc-lightroom" }
pc-apply     = { path = "crates/pc-apply" }
pc-image     = { path = "crates/pc-image" }
pc-hash      = { path = "crates/pc-hash" }
pc-family    = { path = "crates/pc-family" }
pc-organize  = { path = "crates/pc-organize" }
pc-api       = { path = "crates/pc-api" }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
rayon = "1"
tempfile = "3"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "webp", "gif"] }
kamadak-exif = "0.6"
quick-xml = "0.38"
memmap2 = "0.9"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
mime_guess = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
