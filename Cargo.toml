[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
pc-core      = { path = "crates/pc-core" }
pc-db        = { path = "crates/pc-db" }
pc-walk      = { path = "crates/pc-walk" }
pc-lightroom = { path = "crates/pc-lightroom" }
pc-apply     = { path = "crates/pc-apply" }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
rayon = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
